<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MockKit Panel</title>
    <style>
      :root { color-scheme: light dark; }
      html, body {
        margin: 0;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 13px;
        background: #fff;
        color: #1f2329;
      }
      @media (prefers-color-scheme: dark) {
        html, body { background: #1e1e1e; color: #d4d4d4; }
      }
      .mk-panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        height: 100vh;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
      }
      .mk-panel h1 { font-size: 16px; margin: 0; font-weight: 600; }
      .mk-title { display: inline-flex; align-items: center; gap: 8px; }
      .mk-beta-badge {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.5px;
        padding: 2px 6px;
        border-radius: 3px;
        background: #fa8c16;
        color: #fff;
        text-transform: uppercase;
      }
      .mk-panel p { margin: 0; line-height: 1.6; opacity: 0.8; max-width: 360px; }
      .mk-status {
        font-size: 12px;
        padding: 4px 10px;
        border-radius: 10px;
        background: #f0f2f5;
        color: #4480f7;
      }
      @media (prefers-color-scheme: dark) {
        .mk-status { background: #2a2a2a; color: #6ea8ff; }
      }
      .mk-status--ok { background: #e6f7ec; color: #1a9b7f; }
      .mk-status--err { background: #fdecec; color: #d4380d; }
      @media (prefers-color-scheme: dark) {
        .mk-status--ok { background: #15301f; color: #4ec89b; }
        .mk-status--err { background: #3a1f1f; color: #ff7875; }
      }
      .mk-btn {
        appearance: none;
        border: 1px solid #4480f7;
        background: #4480f7;
        color: #fff;
        padding: 6px 16px;
        border-radius: 4px;
        font-size: 13px;
        cursor: pointer;
      }
      .mk-btn:hover { background: #2e6fe0; }
      .mk-hint { font-size: 11px; opacity: 0.6; max-width: 320px; }
    </style>
  </head>
  <body>
    <div class="mk-panel">
      <h1 class="mk-title">
        <span id="mk-title-text">MockKit Workbench</span>
        <span id="mk-beta-badge" class="mk-beta-badge" hidden>Beta</span>
      </h1>
      <p id="mk-desc">Opening the workbench on the inspected page&hellip;</p>
      <div id="mk-status" class="mk-status">mounting</div>
      <button id="mk-retry" class="mk-btn" type="button" hidden>Retry mount</button>
      <p class="mk-hint">
        The workbench mounts as an iframe on the inspected page (right side),
        same UI as the toolbar action. If the page is a restricted chrome:// or
        chrome-extension:// page, mounting is blocked by Chrome.
      </p>
    </div>
    <script src="panel.js"></script>
  </body>
</html>
